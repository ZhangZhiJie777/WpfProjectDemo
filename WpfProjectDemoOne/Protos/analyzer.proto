syntax = "proto3";

option csharp_namespace = "Analyzer";

package analyzer;

// 名称值对消息
message NameValuePair {
  string name = 1;           // 名称
  double value = 2;          // 值
}

// 参数消息
message Parameters {
  repeated NameValuePair pairs = 1;  // 参数名称值对列表
}

// 电极消息
message Electrodes {
  repeated NameValuePair pairs = 1;  // 电极名称值对列表
}

// 板卡消息
message Boards {
  repeated NameValuePair pairs = 1;  // 板卡名称值对列表
}

// 数据变化响应消息
message DataChangeResponse {
  Parameters changed_parameters = 1;       // 变化的参数
  Electrodes changed_electrodes = 2;       // 变化的电极
  Boards changed_boards = 3;               // 变化的板卡
  bool success = 4;                       // 是否成功
  string message = 5;                     // 消息
}

// gRPC分析器服务
service AnalyzerAPI {
  // 设置参数值
  rpc SetParameters (SetParametersRequest) returns (DataChangeResponse);
  
  // 更新电极值
  rpc UpdateElectrodes (UpdateElectrodesRequest) returns (DataChangeResponse);
  
  // 更新板卡值
  rpc UpdateBoards (UpdateBoardsRequest) returns (DataChangeResponse);
  
  // 全部更新
  rpc UpdateAll (UpdateAllRequest) returns (DataChangeResponse);
  
  // 获取所有数据（参数+电极+板卡）
  rpc GetAllData (GetAllDataRequest) returns (DataChangeResponse);
}

// 设置参数请求
message SetParametersRequest {
  Parameters parameters = 1;  // 要设置的参数
}

// 更新电极请求
message UpdateElectrodesRequest {
  // 空消息，使用当前服务器中的参数值
}

// 更新板卡请求
message UpdateBoardsRequest {
  // 空消息，使用当前服务器中的电极值
}

// 全部更新请求
message UpdateAllRequest {
  // 空消息，执行完整计算流程
}

// 获取所有数据请求
message GetAllDataRequest {
  // 空消息，获取所有参数、电极和板卡
}
